<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空气污染源许可与合规检查</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}</style></head><body><h1>空气污染源许可与合规检查</h1><p>管理设施、排放口、治理设备、现场检查、整改和许可续期；快到期许可的剩余排放指标可转移给在建许可。</p><p>申报量超过许可量或检查发现高严重度问题时提高优先级；存在未关闭整改时不能批准。</p><p>转移结算：可转移量＝余量台账余额−未关闭整改占用；受理冻结双方版本，许可数量/状态/整改一变即释放重算，已结算保留依据与影响；分阶段幂等，写入失败凭结算单续办不重复扣。</p><button onclick="loadItems()">刷新许可列表</button> <button onclick="loadTransfers()">刷新结算单</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>const H={'X-Actor':'demo','X-Role':'viewer'};async function loadItems(){const r=await fetch('/api/items',{headers:H});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}async function loadTransfers(){const r=await fetch('/api/transfers',{headers:H});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
